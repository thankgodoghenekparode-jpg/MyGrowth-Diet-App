<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09162A">
  <meta name="description" content="MyGrowth Diet App is the member app of Healings Erhuvwuigho Azuike Ministry. Daily devotions, Bible reading, a growth plan and prayer partners for ministry members.">
  <meta name="application-name" content="MyGrowth Diet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyGrowth Diet App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyGrowth Diet App | Healings Erhuvwuigho Azuike Ministry</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body { margin: 0; min-height: 100%; background: #09162A; }
    #startup-loader { min-height: 100vh; display: grid; place-items: center; }
    #startup-loader::after {
      content: ""; width: 30px; height: 30px; border: 3px solid #ffffff35;
      border-top-color: #D5A648; border-radius: 50%; animation: startup-spin .8s linear infinite;
    }
    @keyframes startup-spin { to { transform: rotate(360deg); } }
    #startup-recovery { position: fixed; inset: auto 16px 24px; text-align: center; font: 14px Arial, sans-serif; color: #F7F9FC; }
    #startup-retry { margin-top: 10px; padding: 11px 20px; border: 0; border-radius: 8px; background: #D5A648; color: #09162A; font-size: 16px; font-weight: 700; }
  </style>
  <div id="startup-loader" role="status" aria-label="Loading"></div>
  <div id="startup-recovery" hidden>
    <div id="startup-message">The app could not load. Please try again.</div>
    <button id="startup-retry" type="button">Reload app</button>
  </div>
  <script>
    (function () {
      var timer = window.setTimeout(showRecovery, 20000);
      function showRecovery() {
        var recovery = document.getElementById('startup-recovery');
        if (recovery) recovery.hidden = false;
      }
      window.addEventListener('flutter-first-frame', function () {
        window.clearTimeout(timer);
        var loader = document.getElementById('startup-loader');
        var recovery = document.getElementById('startup-recovery');
        if (loader) loader.remove();
        if (recovery) recovery.remove();
      }, { once: true });
      document.getElementById('startup-retry').addEventListener('click', async function () {
        var button = this;
        button.disabled = true;
        button.textContent = 'Reloading…';
        try {
          if ('serviceWorker' in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          }
          if ('caches' in window) {
            var names = await caches.keys();
            await Promise.all(names.filter(function (name) { return name.indexOf('mygrowth-shell-') === 0; }).map(function (name) { return caches.delete(name); }));
          }
        } catch (_) {
          // Reload even when browser cache cleanup is unavailable.
        }
        window.location.reload();
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', async () => {
        try {
          const workerUrl = new URL('service-worker.js', document.baseURI);
          const exists = await fetch(workerUrl, { method: 'HEAD' });
          if (exists.ok) await navigator.serviceWorker.register(workerUrl, { scope: new URL('.', document.baseURI).pathname });
        } catch (_) {
          // The app still runs online when the host does not publish a worker.
        }
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="document.getElementById('startup-message').textContent='The app files could not be loaded. Check your connection and reload.'; document.getElementById('startup-recovery').hidden=false;"></script>
</body>
</html>
